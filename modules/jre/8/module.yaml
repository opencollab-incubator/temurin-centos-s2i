schema_version: 1

name: "opencollaboration.container.temurin.jre"
description: "Installs only the JRE headless for Eclipse Temurin 8."
version: "8"

labels:
- name: "org.jboss.product"
  value: "openjdk"
- name: "org.jboss.product.version"
  value: "1.8.0"
- name: "org.jboss.product.openjdk.version"
  value: "1.8.0"

envs:
- name: "JAVA_HOME"
  value: "/usr/lib/jvm/jre"
- name: "JAVA_VENDOR"
  value: "openjdk"
- name: "JAVA_VERSION"
  value: "1.8.0"
- name: JBOSS_CONTAINER_OPENJDK_JRE_MODULE
  value: /opt/jboss/container/openjdk/jre

packages:
  install:
  - temurin-8-jre

modules:
  install:
  - name: jboss.container.user
  - name: jboss.container.openjdk

execute:
- script: configure.sh
