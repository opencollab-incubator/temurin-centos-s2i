schema_version: 1

name: "opencollaboration.container.temurin.jre"
description: "Installs only the JRE headless for Eclipse Temurin 11."
version: "11"

labels:
- name: "org.jboss.product"
  value: "openjdk"
- name: "org.jboss.product.version"
  value: "11"
- name: "org.jboss.product.openjdk.version"
  value: "11"

envs:
- name: "JAVA_HOME"
  value: "/usr/lib/jvm/temurin-11-jre"
- name: "JAVA_VENDOR"
  value: "Adoptium"
- name: "JAVA_VERSION"
  value: "11"
- name: JBOSS_CONTAINER_OPENJDK_JRE_MODULE
  value: /opt/jboss/container/openjdk/jre

packages:
  install:
  - temurin-11-jre

modules:
  install:
  - name: jboss.container.user
  - name: jboss.container.openjdk

execute:
- script: configure.sh
