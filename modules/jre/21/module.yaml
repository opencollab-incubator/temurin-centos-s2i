schema_version: 1

name: "opencollaboration.container.temurin.jre"
description: "Installs only the JRE headless for OpenJDK 21."
version: &jdkver "21"

labels:
- name: "org.jboss.product"
  value: "openjdk"
- name: "org.jboss.product.version"
  value: *jdkver
- name: "org.jboss.product.openjdk.version"
  value: *jdkver

envs:
- name: "JAVA_HOME"
  value: "/usr/lib/jvm/temurin-21-jre"
- name: "JAVA_VENDOR"
  value: "Adoptium"
- name: "JAVA_VERSION"
  value: *jdkver
- name: JBOSS_CONTAINER_OPENJDK_JRE_MODULE
  value: /opt/jboss/container/openjdk/jre

packages:
  install:
  - temurin-21-jre

modules:
  install:
  - name: jboss.container.user
  - name: jboss.container.openjdk

execute:
- script: configure.sh
