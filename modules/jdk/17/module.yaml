schema_version: 1

name: "opencollaboration.container.temurin.jdk"
description: "Installs the JDK for Eclipse Temurin 17."
version: "17"

labels:
- name: "org.jboss.product"
  value: "openjdk"
- name: "org.jboss.product.version"
  value: "17"
- name: "org.jboss.product.openjdk.version"
  value: "17"

envs:
- name: "JAVA_HOME"
  value: "/usr/lib/jvm/temurin-17-jdk"
- name: "JAVA_VENDOR"
  value: "openjdk"
- name: "JAVA_VERSION"
  value: "17"
- name: JBOSS_CONTAINER_OPENJDK_JDK_MODULE
  value: /opt/jboss/container/openjdk/jdk

packages:
  install:
  - temurin-17-jdk

modules:
  install:
  - name: jboss.container.user
  - name: jboss.container.openjdk

execute:
- script: configure.sh
