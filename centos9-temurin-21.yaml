# This is an Image descriptor for Cekit

schema_version: 1

from: "quay.io/centos/centos:stream9-minimal"
name: &name "opencollab-incubator/centos9-temurin-21"
version: &version "1.21"
description: "Source To Image (S2I) image for OKD and Red Hat OpenShift providing Eclipse Temurin Java 21"

labels:
- name: "io.k8s.description"
  value: "Platform for building and running plain Java applications (fat-jar and flat classpath)"
- name: "io.k8s.display-name"
  value: "Java Applications"
- name: "io.openshift.tags"
  value: "builder,java"
- name: "maintainer"
  value: "Open Collaboration <hello@opencollaboration.dev>"
- name: "usage"
  value: &docs "https://opencollab-incubator.github.io/temurin-centos-s2i/"
- name: "org.opencontainers.image.documentation"
  value: *docs
- name: "name"
  value: *name
- name: "version"
  value: *version

envs:
- name: PATH
  value: $PATH:"/usr/local/s2i"
- name: "JBOSS_IMAGE_NAME"
  value: *name
- name: "JBOSS_IMAGE_VERSION"
  value: *version
- name: "LANG"
  value: "C.utf8"

ports:
- value: 8080
- value: 8443

modules:
  repositories:
  - path: modules
  install:
  - name: opencollaboration.container.adoptium.repo
  - name: jboss.container.util.pkg-update
  - name: opencollaboration.container.temurin.jdk
    version: "21"
  - name: jboss.container.util.tzdata
  - name: jboss.container.java.s2i.bash
  - name: jboss.container.util.tzdata

help:
  add: true

packages:
  manager: microdnf
