# This is an Image descriptor for Cekit

schema_version: 1

from: "quay.io/centos/centos:stream9-minimal"
name: &name "opencollab-incubator/centos9-temurin-11-runtime"
version: &version "1.21"
description: "Image for OKD and Red Hat OpenShift providing Eclipse Temurin Java 11 runtime"

labels:
- name: "io.k8s.description"
  value: "Platform for running plain Java applications (fat-jar and flat classpath)"
- name: "io.k8s.display-name"
  value: "Java Applications"
- name: "io.openshift.tags"
  value: "java"
- name: "maintainer"
  value: "Open Collaboration <hello@opencollaboration.dev>"
- name: "usage"
  value: &docs "https://opencollab-incubator.github.io/temurin-centos-s2i/"
- name: "org.opencontainers.image.documentation"
  value: *docs
- name: "name"
  value: *name
- name: "version"
  value: *version

envs:
- name: "JBOSS_IMAGE_NAME"
  value: *name
- name: "JBOSS_IMAGE_VERSION"
  value: *version
- name: "LANG"
  value: "C.utf8"

ports:
- value: 8080
- value: 8443

modules:
  repositories:
  - path: modules
  install:
  - name: opencollaboration.container.adoptium.repo
  - name: jboss.container.util.pkg-update
  - name: jboss.container.tar
  - name: opencollaboration.container.temurin.jre
    version: "11"
  - name: jboss.container.util.tzdata
  - name: jboss.container.java.jre.run

help:
  add: true

packages:
  manager: microdnf
